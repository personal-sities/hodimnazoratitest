version: '3.8'

services:
  # 1. PostgreSQL Ma'lumotlar bazasi (Ubuntu lokal)
  db:
    image: postgres:16-alpine
    container_name: aloqapro_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-aloqapro}
      POSTGRES_USER: ${DB_USER:-aloqa_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aloqa_password}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. AloqaPro Server ilovasi
  app:
    build: .
    container_name: aloqapro_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${DB_USER:-aloqa_user}:${DB_PASSWORD:-aloqa_password}@db:5432/${DB_NAME:-aloqapro}
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
