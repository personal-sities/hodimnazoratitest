# ============================================================
#  workmeter.uz uchun Nginx konfiguratsiyasi
#  Fayl joylashuvi (Ubuntu serverda): /etc/nginx/sites-available/workmeter.uz
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name workmeter.uz www.workmeter.uz;

    # Katta hajmdagi fayllar va rasmlar (Face-ID / hisobotlar) uchun chegara
    client_max_body_size 50M;

    # Xavfsizlik sarlavhalari (Security headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Barcha so'rovlarni Node.js serveriga (port 3000) yo'naltirish
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket va jonli ulanishlar uchun sarlavhalar
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Mijozning haqiqiy IP manzili va ma'lumotlarini to'g'ri uzatish
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # So'rov kutish vaqtlari (timeout)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Statik fayllar (ixtiyoriy, Nginx orqali yanada tezkor keshlanishi uchun)
    location ~* \.(ico|css|js|gif|jpeg|jpg|png|woff|woff2|ttf|svg|wasm|bin)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
